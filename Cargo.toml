[package]
name = "gcs-webhook"
version = "0.1.1"
edition = "2024"
description = "A minimal webhook receiver that writes each request body and its metadata to Google Cloud Storage"
license = "MIT"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["http2"] }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gcp_auth = "0.12"
hex = "0.4"
hmac = "0.13"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
percent-encoding = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
http-body = "1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
